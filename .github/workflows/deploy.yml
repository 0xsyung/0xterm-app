name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node 24 (not 20): jsdom@30 + @testing-library/jest-dom + @ethereumjs
      # require Node >=22, and npm@10 can't resolve the @noble/hashes tree.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Same-origin NEWS mirror (#213): allowlist-gated RSS → public/news/<id>.xml
      # so the static app does not depend on rss2json/cors.lol as primary transport.
      - name: Fetch NEWS allowlist feeds
        run: node scripts/fetch-news-feeds.mjs
        continue-on-error: false

      - name: Build static files
        # Bake HL builder fee address from repo secret (no hardcode).
        # Optional: NEXT_PUBLIC_NEWS_PROXY_URL → CF Worker origin (no trailing slash).
        env:
          NEXT_PUBLIC_HL_BUILDER_ADDRESS: ${{ secrets.NEXT_PUBLIC_HL_BUILDER_ADDRESS }}
          NEXT_PUBLIC_NEWS_PROXY_URL: ${{ secrets.NEXT_PUBLIC_NEWS_PROXY_URL }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
